# ============================================================
# event_type_keywords.yml — v1.0.0
# Keywords para Event Detection (classification/event_detection.py)
# ============================================================
# Heurística de MVP, no un Taxonomy Engine real (Parte 2A) — ver
# discusión en classification/event_detection.py. Se externaliza a YAML
# porque estaba hardcodeada en Python sin necesidad; esto no resuelve
# ni pretende resolver la discusión de arquitectura más amplia de un
# Taxonomy Engine real (aliases, pesos, multi-idioma, etc.), que sigue
# postergada.
#
# El orden de las entradas es el orden de desempate cuando dos
# EventType empatan en cantidad de keywords encontradas (gana el
# primero de esta lista) — ver infer_event_type().
version: "1.0.0"

